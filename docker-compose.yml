name: hair-reality
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hair_reality
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: hair_reality
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - hair-reality-pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hair_reality -d hair_reality"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  hair-reality-pg:
